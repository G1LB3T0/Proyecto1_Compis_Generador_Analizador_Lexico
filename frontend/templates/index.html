<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YALex + YAPar — Generador de Compiladores</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<!-- ── Sidebar ─────────────────────────────────────────────── -->
<aside class="sidebar">
  <div class="logo">
    <h1>YALex + YAPar</h1>
    <p>Generador de Compiladores</p>
  </div>

  <!-- Archivos -->
  <div>
    <div class="section-label">Archivos</div>
    <div style="display:flex;flex-direction:column;gap:8px;">
      <div>
        <div style="font-size:.78rem;color:var(--subtext);margin-bottom:4px;">.yal — Léxico</div>
        <select id="sel-yal" onchange="onFileChange()"><option value="">Cargando...</option></select>
      </div>
      <div>
        <div style="font-size:.78rem;color:var(--subtext);margin-bottom:4px;">.yalp — Gramática</div>
        <select id="sel-yalp" onchange="onFileChange()"><option value="">Cargando...</option></select>
      </div>
      <!-- Botón editor -->
      <button class="btn btn-secondary" id="btn-editor" onclick="toggleEditor()" style="font-size:.8rem;padding:7px;">
        <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        Abrir Editor
      </button>
    </div>
  </div>

  <!-- Método -->
  <div>
    <div class="section-label">Método de análisis</div>
    <div class="radio-group" id="method-group">
      <label class="radio-option active" data-method="slr">
        <input type="radio" name="method" value="slr" checked>
        <div class="radio-dot"></div>
        <div class="radio-label">
          <strong>SLR(1)</strong>
          <small>LR(0) + FOLLOW(A)</small>
        </div>
      </label>
      <label class="radio-option" data-method="lalr">
        <input type="radio" name="method" value="lalr">
        <div class="radio-dot"></div>
        <div class="radio-label">
          <strong>LALR(1)</strong>
          <small>LR(1) con fusión de estados</small>
        </div>
      </label>
      <label class="radio-option" data-method="ll1">
        <input type="radio" name="method" value="ll1">
        <div class="radio-dot"></div>
        <div class="radio-label">
          <strong>LL(1)</strong>
          <small>FIRST / FOLLOW (top-down)</small>
        </div>
      </label>
    </div>
  </div>

  <!-- Construir tabla -->
  <button class="btn btn-primary" id="btn-build" onclick="buildTable()">
    <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="5 3 19 12 5 21 5 3"/></svg>
    Construir Tabla
  </button>

  <!-- Evaluar cadena -->
  <div id="parse-section" style="display:none;flex-direction:column;gap:8px;">
    <div class="section-label">Evaluar cadena</div>

    <!-- Input manual (textarea para soportar código multilinea) -->
    <textarea id="input-str" rows="4"
              placeholder="Ej: x + y * z&#10;O pega aquí tu código C++"
              style="width:100%;resize:vertical;font-family:'JetBrains Mono',monospace;font-size:.76rem;background:var(--surface0);color:var(--text);border:1px solid var(--surface1);border-radius:var(--radius);padding:8px;line-height:1.5;"></textarea>

    <div style="display:flex;gap:6px;">
      <button class="btn btn-secondary" style="flex:1" onclick="parseInput()">
        <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        Analizar
      </button>
      <!-- Cargar cadenas desde archivo -->
      <label class="btn btn-secondary" style="width:38px;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0" title="Cargar cadenas desde .txt">
        <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        <input type="file" accept=".txt" onchange="loadInputFile(event)" style="display:none">
      </label>
    </div>

    <!-- Lista de cadenas del archivo -->
    <div id="strings-panel" style="display:none;flex-direction:column;gap:4px;">
      <div style="font-size:.72rem;color:var(--overlay);margin-bottom:2px;">Cadenas del archivo — clic para seleccionar:</div>
      <div id="strings-list"></div>
    </div>
  </div>

  <div class="status-bar" id="status">Selecciona archivos y un método.</div>
</aside>

<!-- ── Main ────────────────────────────────────────────────── -->
<main class="main" id="main-wrap">

  <!-- ── Editor panel (oculto por defecto) ─────────────────── -->
  <div id="editor-panel" style="display:none;" class="pipeline-step editor-step">
    <div class="step-header" style="cursor:default;">
      <!-- Tabs -->
      <div class="editor-tabs">
        <button class="editor-tab active" data-tab="yal"  onclick="switchTab('yal')">
          <span id="tab-yal-label">.yal</span>
        </button>
        <button class="editor-tab" data-tab="yalp" onclick="switchTab('yalp')">
          <span id="tab-yalp-label">.yalp</span>
        </button>
      </div>
      <div style="display:flex;align-items:center;gap:10px;margin-left:auto;">
        <span id="save-status" style="font-size:.78rem;"></span>
        <button class="btn btn-secondary" onclick="saveCurrentFile()"
                style="width:auto;padding:5px 14px;font-size:.8rem;">
          <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
          Guardar
        </button>
        <button onclick="toggleEditor()"
                style="background:none;border:none;color:var(--subtext);cursor:pointer;padding:0 4px;display:flex;align-items:center;">
          <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
    </div>
    <!-- Textareas -->
    <div id="editor-yal"  class="editor-pane">
      <textarea id="textarea-yal"  class="code-editor" spellcheck="false"
                oninput="markDirty('yal')"></textarea>
    </div>
    <div id="editor-yalp" class="editor-pane" style="display:none;">
      <textarea id="textarea-yalp" class="code-editor" spellcheck="false"
                oninput="markDirty('yalp')"></textarea>
    </div>
  </div>

  <!-- ── Pipeline ──────────────────────────────────────────── -->
  <div id="main">
    <div class="empty-state">
      <div class="icon">
        <svg class="empty-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><line x1="9" y1="1" x2="9" y2="4"/><line x1="15" y1="1" x2="15" y2="4"/><line x1="9" y1="20" x2="9" y2="23"/><line x1="15" y1="20" x2="15" y2="23"/><line x1="20" y1="9" x2="23" y2="9"/><line x1="20" y1="14" x2="23" y2="14"/><line x1="1" y1="9" x2="4" y2="9"/><line x1="1" y1="14" x2="4" y2="14"/></svg>
      </div>
      <p>Selecciona un archivo <strong>.yal</strong> y un <strong>.yalp</strong>,<br>
         elige el método y presiona <strong>Construir Tabla</strong>.</p>
    </div>
  </div>

</main>

<script src="/static/js/app.js"></script>
</body>
</html>
