<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compiscript IDE — ANTLR + C++</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">C</div>
      <div>
        <h1>Compiscript</h1>
        <p>ANTLR · Visitor · C++</p>
      </div>
    </div>

    <section>
      <label class="section-label" for="example-select">Ejemplos .cps</label>
      <select id="example-select"></select>
      <button class="button secondary" id="load-example">Abrir ejemplo</button>
    </section>

    <section>
      <label class="section-label" for="filename">Archivo actual</label>
      <input id="filename" value="program.cps" autocomplete="off">
      <div class="button-grid">
        <button class="button secondary" id="new-file">Nuevo</button>
        <label class="button secondary file-button">
          Cargar
          <input id="local-file" type="file" accept=".cps">
        </label>
      </div>
      <div class="button-grid">
        <button class="button secondary" id="save-file">Guardar</button>
        <button class="button secondary" id="download-file">Descargar</button>
      </div>
    </section>

    <button class="button primary" id="analyze-button">
      <span>▶</span> Analizar programa
    </button>
    <button class="button tests" id="tests-button">Ejecutar batería de pruebas</button>

    <div class="pipeline-note">
      <strong>Pipeline activo</strong>
      <span>Lexer ANTLR → Parser ANTLR → árbol → Visitor semántico → tabla de símbolos</span>
    </div>
    <div id="status" class="status">Listo para analizar.</div>
  </aside>

  <main class="workspace">
    <header class="topbar">
      <div>
        <h2>Entorno de análisis semántico</h2>
        <p>Escribe Compiscript y revisa cada resultado del frontend C++.</p>
      </div>
      <div class="runtime-badge"><span></span> C++17</div>
    </header>

    <section class="editor-card">
      <div class="panel-header">
        <div class="file-tab"><span class="dot"></span><span id="tab-name">program.cps</span></div>
        <div id="cursor-position">Ln 1, Col 1</div>
      </div>
      <textarea id="source-editor" spellcheck="false" aria-label="Editor de Compiscript"></textarea>
    </section>

    <section id="summary" class="summary-grid hidden"></section>

    <section id="results" class="results hidden">
      <nav class="tabs" aria-label="Resultados">
        <button class="tab active" data-panel="diagnostics-panel">Diagnósticos <span id="diagnostic-count">0</span></button>
        <button class="tab" data-panel="tree-panel">Árbol sintáctico</button>
        <button class="tab" data-panel="symbols-panel">Tabla de símbolos</button>
        <button class="tab" data-panel="types-panel">Sistema de tipos</button>
        <button class="tab" data-panel="scopes-panel">Manejo de ámbitos</button>
        <button class="tab" data-panel="tokens-panel">Tokens</button>
        <button class="tab" data-panel="classes-panel">Clases</button>
      </nav>

      <div id="diagnostics-panel" class="result-panel active"></div>
      <div id="tree-panel" class="result-panel"></div>
      <div id="symbols-panel" class="result-panel"></div>
      <div id="types-panel" class="result-panel"></div>
      <div id="scopes-panel" class="result-panel"></div>
      <div id="tokens-panel" class="result-panel"></div>
      <div id="classes-panel" class="result-panel"></div>
    </section>

    <section id="tests-result" class="tests-result hidden"></section>
  </main>

  <script src="/static/js/app.js"></script>
</body>
</html>
